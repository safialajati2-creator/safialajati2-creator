<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Alajati — Animated Developer Banner</title>
  <desc id="desc">Animated holographic banner for Mustafa Alajati with moving light, orbit lines, scan beam, particles and terminal cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".48" stop-color="#081126"/>
      <stop offset="1" stop-color="#12051d"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".27" stop-color="#60a5fa"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset=".76" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.45 0;0.45 0;-0.45 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cyanOrb">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="24" y="24" width="1152" height="372" rx="28"/></clipPath>
    <style>
      .name{font:800 70px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:8px}
      .role{font:600 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3.2px}
      .micro{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.4px}
      .orbit1{transform-origin:600px 212px;animation:spin 20s linear infinite}
      .orbit2{transform-origin:600px 212px;animation:spinBack 14s linear infinite}
      .orbit3{transform-origin:600px 212px;animation:spin 32s linear infinite}
      .scan{animation:scan 5.5s linear infinite}
      .float1{animation:float1 8s ease-in-out infinite}
      .float2{animation:float2 10s ease-in-out infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .blink{animation:blink 1s steps(1) infinite}
      .dash{stroke-dasharray:10 18;animation:dash 9s linear infinite}
      .titleGlow{animation:titleGlow 3.8s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinBack{to{transform:rotate(-360deg)}}
      @keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(500px)}}
      @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-14px)}}
      @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,16px)}}
      @keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
      @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
      @keyframes dash{to{stroke-dashoffset:-280}}
      @keyframes titleGlow{0%,100%{opacity:.88}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle class="float1" cx="145" cy="95" r="255" fill="url(#cyanOrb)"/>
    <circle class="float2" cx="1050" cy="330" r="285" fill="url(#violetOrb)"/>
    <rect x="24" y="24" width="1152" height="372" fill="url(#grid)"/>
    <g opacity=".28" fill="none" stroke="url(#holo)">
      <ellipse class="orbit1" cx="600" cy="212" rx="350" ry="118" stroke-width="1.2" stroke-dasharray="4 14"/>
      <ellipse class="orbit2" cx="600" cy="212" rx="435" ry="160" stroke-width=".9" stroke-dasharray="32 18 3 18"/>
      <ellipse class="orbit3" cx="600" cy="212" rx="500" ry="190" stroke-width=".65" stroke-dasharray="2 25"/>
    </g>
    <path class="dash" d="M55 320C190 250 292 352 420 291S672 248 810 305s221-29 335-93" fill="none" stroke="url(#holo)" stroke-width="1.2" opacity=".27"/>
    <g class="scan" opacity=".38">
      <rect x="24" y="0" width="1152" height="2" fill="url(#holo)" filter="url(#glow)"/>
      <rect x="24" y="2" width="1152" height="42" fill="url(#holo)" opacity=".045"/>
    </g>
    <g fill="#8ff8ff" filter="url(#smallGlow)">
      <circle class="pulse" cx="104" cy="102" r="2.5"/>
      <circle class="pulse" cx="1092" cy="102" r="2.5" style="animation-delay:.6s"/>
      <circle class="pulse" cx="1038" cy="326" r="2.2" style="animation-delay:1.1s"/>
      <circle class="pulse" cx="145" cy="325" r="2.2" style="animation-delay:1.7s"/>
      <circle class="pulse" cx="305" cy="68" r="1.6" style="animation-delay:2.1s"/>
      <circle class="pulse" cx="903" cy="355" r="1.6" style="animation-delay:.25s"/>
      <circle class="pulse" cx="225" cy="205" r="1.7" style="animation-delay:1.35s"/>
      <circle class="pulse" cx="984" cy="210" r="1.7" style="animation-delay:2.35s"/>
    </g>
  </g>
  <rect x="24" y="24" width="1152" height="372" rx="28" fill="none" stroke="url(#holo)" stroke-opacity=".6" stroke-width="1.5"/>
  <path d="M58 55h86M58 55v44M1142 55h-86M1142 55v44M58 365h86M58 365v-44M1142 365h-86M1142 365v-44" fill="none" stroke="url(#holo)" stroke-width="2" stroke-linecap="round" opacity=".78"/>
  <text x="600" y="103" text-anchor="middle" class="micro" fill="#79eef7" opacity=".84">&gt; SAFIALAJATI2 / DEVELOPER PROFILE</text>
  <g class="titleGlow" filter="url(#glow)">
    <text x="600" y="214" text-anchor="middle" class="name" fill="url(#holo)">MUSTAFA</text>
    <text x="600" y="276" text-anchor="middle" class="name" font-size="49" fill="url(#holo)">ALAJATI</text>
  </g>
  <g text-anchor="middle">
    <text x="590" y="326" class="role" fill="#e2e8f0">SOFTWARE DEVELOPER · AUTOMATION · AI SYSTEMS</text>
    <rect class="blink" x="921" y="308" width="9" height="21" rx="1.5" fill="#67e8f9" filter="url(#smallGlow)"/>
  </g>
  <text x="62" y="379" class="micro" fill="#7dd3fc" opacity=".58">SYSTEM: ONLINE</text>
  <text x="1138" y="379" text-anchor="end" class="micro" fill="#e879f9" opacity=".58">BUILD // AUTOMATE // IMPROVE</text>
</svg>