<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Alajati — Software Developer</title>
  <desc id="desc">Minimal dark technology banner for Mustafa Alajati.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#090d14"/>
      <stop offset="1" stop-color="#0c1119"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#60a5fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.12 0;0.12 0;-0.12 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172334"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>

    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="microGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7dd3fc" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <style>
      .name{font:800 67px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:6px}
      .role{font:600 17px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.6px}
      .tag{font:500 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.8px}
      .side{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.1px}
      .micro{font:500 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.5px}
      .pulse{animation:pulse 3.6s ease-in-out infinite}
      .lineMove{animation:lineMove 7s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.9}}
      @keyframes lineMove{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
      @keyframes blink{0%,52%{opacity:1}53%,100%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="380" rx="22" fill="url(#microGrid)" opacity=".9"/>

  <!-- subtle top system line -->
  <g opacity=".55">
    <line x1="54" y1="62" x2="390" y2="62" stroke="#2a3442"/>
    <circle cx="54" cy="62" r="3" fill="#60a5fa" class="pulse"/>
    <text x="70" y="67" class="micro" fill="#7891ad">PROFILE / SOFTWARE DEVELOPMENT / 2026</text>
  </g>

  <!-- left identity block -->
  <text x="72" y="167" class="name" fill="#f4f7fb">MUSTAFA</text>
  <text x="72" y="235" class="name" fill="#f4f7fb">ALAJATI</text>

  <g>
    <rect x="74" y="267" width="42" height="2" rx="1" fill="url(#accent)" filter="url(#glow)"/>
    <text x="132" y="274" class="role" fill="#c9d6e6">SOFTWARE DEVELOPER · AUTOMATION · AI SYSTEMS</text>
    <rect x="612" y="256" width="8" height="22" rx="1.5" fill="#7dd3fc" class="cursor"/>
  </g>

  <g class="lineMove">
    <text x="74" y="326" class="tag" fill="#7fa9d8">Turning ideas into practical systems.</text>
    <line x1="74" y1="344" x2="356" y2="344" stroke="url(#accent)" stroke-width="1.4" opacity=".65"/>
  </g>

  <!-- right capability rail -->
  <line x1="915" y1="88" x2="915" y2="294" stroke="#6b7a8c" stroke-opacity=".7"/>
  <g class="side" fill="#9db0c7">
    <text x="942" y="110">BUILD</text>
    <text x="942" y="147">AUTOMATE</text>
    <text x="942" y="184">DEVELOP</text>
    <text x="942" y="221">IMPROVE</text>
    <text x="942" y="258">REPEAT</text>
  </g>
  <g fill="#60a5fa">
    <circle cx="915" cy="105" r="3" class="pulse"/>
    <circle cx="915" cy="142" r="3" class="pulse" style="animation-delay:.4s"/>
    <circle cx="915" cy="179" r="3" class="pulse" style="animation-delay:.8s"/>
    <circle cx="915" cy="216" r="3" class="pulse" style="animation-delay:1.2s"/>
    <circle cx="915" cy="253" r="3" class="pulse" style="animation-delay:1.6s"/>
  </g>

  <!-- geometric mountain / system silhouette -->
  <path d="M525 420L682 300L740 337L821 241L905 311L968 263L1078 354L1200 294V420Z" fill="url(#ridge2)"/>
  <path d="M610 420L760 325L823 274L887 334L951 291L1010 333L1074 301L1200 365V420Z" fill="url(#ridge)" opacity=".9"/>
  <path d="M823 274L887 334L951 291" fill="none" stroke="#76aee9" stroke-opacity=".26" stroke-width="1.2"/>
  <path d="M682 300L740 337L821 241L905 311" fill="none" stroke="#93c5fd" stroke-opacity=".18" stroke-width="1"/>

  <!-- lower metadata -->
  <text x="72" y="383" class="micro" fill="#53677e">WEB · AUTOMATION · DATA · GAME DEVELOPMENT</text>
  <text x="1128" y="383" text-anchor="end" class="micro" fill="#53677e">BUILDING PRACTICAL SOFTWARE</text>

  <rect x="20" y="20" width="1160" height="380" rx="22" fill="none" stroke="#202936" stroke-width="1"/>
  <path d="M20 74h12M20 74V40Q20 20 40 20h34M1180 346h-12M1180 346v34q0 20-20 20h-34" fill="none" stroke="#3c4e63" stroke-width="1.4"/>
</svg>